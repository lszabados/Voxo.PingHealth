name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    defaults:
      run:
        working-directory: ./
        
    env:
      Solution_Name: Voxo.ERP                         # Replace with your solution name, i.e. MyWpfApp.sln.
      
    steps:
    - name: Runner information
      shell: bash
      run: |
        echo "Runner: $RUNNER_NAME"
        echo "OS: $RUNNER_OS"
        echo "Architecture: $RUNNER_ARCH"
        echo "Image: $ImageOS"
        echo "Image version: $ImageVersion"
        echo "CPU count: $(nproc)"
        df -h /
        df -h /var/lib/docker
        lsblk -o NAME,SIZE,TYPE,MOUNTPOINTS

